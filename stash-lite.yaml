# ======================================================================
# us-kg/clash-rules-lite — Stash (iOS) Config
# https://github.com/us-kg/clash-rules-lite
#
# Adapted for Stash (Clash Premium core on iOS).
#
# Rule sets: lightweight, hand-maintained in us-kg/clash-rules-lite,
# auto-published via jsDelivr CDN:
#     proxy-rules.txt     Domains that go through the proxy
#     direct-rules.txt    Domains that go direct (TikTok, YouTube…)
#     edu-rules.txt       School & education domains (-> School group)
#     adslite-rules.txt   Lightweight ad/tracker blocklist (~65k)
#     backcn-rules.txt    BackCN: mainland-locked services (-> BackCN group, e.g. 抖音)
#
# QUICK START (iOS)
#   1. In Stash: Settings → Config → Download from URL, paste:
#      https://cdn.jsdelivr.net/gh/us-kg/clash-rules-lite@release/stash-lite.yaml
#      (Or import this file directly via Files / AirDrop.)
#   2. Replace "https://your-subscription-url" below with your own link.
#   3. Enable the VPN toggle in Stash and allow the VPN permission prompt.
#！
# BACKCN SETUP
#   The BackCN group below is where your return-to-China nodes go.
#   Add a second proxy-provider (or manual proxies) with China nodes,
#   then select them in the BackCN group. Douyin traffic will follow.
# ======================================================================

mode: rule
log-level: info

ipv6: false
tcp-concurrent: true

profile:
  store-selected: true

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53

dns:
  enable: true
  ipv6: false
  listen: :53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - stun.*
    - '*.apple.com'   # iOS services: keep real IP to avoid push/cert issues
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 1.1.1.1
    - 8.8.8.8

# ======================= ADD YOUR NODES HERE =======================
# Option A: use a subscription (recommended). Replace the URL below.
# Option B: define proxies manually (examples commented out).
# Never commit real credentials or subscription URLs to a public repo.
# ======================================================================


# proxies:
  # --- Shadowsocks example ---
  # - {name: HK-SS, type: ss, server: YOUR_SERVER, port: 8388,
  #    cipher: aes-256-gcm, password: YOUR_PASSWORD, udp: true}

proxy-groups:
  - name: Proxy
    type: select
    include-all: true
    proxies: [DIRECT]
  - name: Auto
    type: url-test
    include-all: true
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 50
  - {name: Apple, type: select, proxies: [Proxy, Auto, DIRECT]}
  - {name: Telegram, type: select, proxies: [Proxy, Auto, DIRECT]}
  - {name: School, type: select, proxies: [Proxy, Auto, DIRECT]}
  - {name: BackCN, type: select, proxies: [Proxy, Auto, DIRECT]}
  - {name: ADblock, type: select, proxies: [REJECT, DIRECT]}

# Rule sets: lightweight, hand-maintained in us-kg/clash-rules-lite.
# Published to jsDelivr CDN on every push; refresh interval 24h.
rule-providers:
  Proxy:
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/us-kg/clash-rules-lite@release/proxy-rules.txt
    path: ./ruleset/Proxy.yaml
    interval: 86400
  Direct:
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/us-kg/clash-rules-lite@release/direct-rules.txt
    path: ./ruleset/Direct.yaml
    interval: 86400
  Edu:
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/us-kg/clash-rules-lite@release/edu-rules.txt
    path: ./ruleset/Edu.yaml
    interval: 86400
  ADblock:
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/us-kg/clash-rules-lite@release/adslite-rules.txt
    path: ./ruleset/ADblock.yaml
    interval: 86400
  BackCN:
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/us-kg/clash-rules-lite@release/backcn-rules.txt
    path: ./ruleset/BackCN.yaml
    interval: 86400

rules:
  # Local networks first — never proxied.
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  # Block ads.
  - RULE-SET,ADblock,ADblock
  # Service groups.
  - RULE-SET,Edu,School
  - RULE-SET,BackCN,BackCN
  - GEOSITE,apple,Apple
  - GEOSITE,telegram,Telegram
  # Proxy / direct splits.
  - RULE-SET,Proxy,Proxy
  - RULE-SET,Direct,DIRECT
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,DIRECT
