# ======================================================================
# us-kg/clash — Generic Clash Template (mihomo kernel)
# https://github.com/us-kg/clash
#
# A ready-to-use Clash configuration template. Rule sets come from our
# own lightweight supply chain (us-kg/clash-rules-lite) — no 100k-line
# dumps, every entry is hand-maintained.
#
# QUICK START
#   1. Replace "https://your-subscription-url" below with your own
#      subscription link (or fill in the [proxies] examples).
#   2. Import into Clash Verge Rev / mihomo and enable.
#
#   Rule files (us-kg/clash-rules-lite, auto-published via CDN):
#     proxy-rules.txt     Domains that go through the proxy
#     direct-rules.txt    Domains that go direct
#     edu-rules.txt       School & education domains (-> School group, incl. Microsoft 365)
#     adslite-rules.txt   Lightweight ad/tracker blocklist (~65k)
#     backcn-rules.txt    BackCN: mainland-locked services (-> BackCN group, e.g. 抖音)
#
# BACKCN SETUP
#   The BackCN group below is where your return-to-China nodes go.
#   Add a second proxy-provider (or manual proxies) with China nodes,
#   then select them in the BackCN group. Douyin traffic will follow.
# ======================================================================

mixed-port: 7890
allow-lan: true
ipv6: false
mode: rule
log-level: info
global-client-fingerprint: chrome
external-controller: 127.0.0.1:9090

geodata-mode: true
geox-url:
  geoip: https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat
  geosite: https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb

profile:
  store-selected: true
  store-fake-ip: true

# Traffic sniffing: detect real destination domain for correct routing.
sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true

# TUN mode: capture all device traffic (needs admin/root on first run).
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  listen: :1053
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - stun.*
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 1.1.1.1
    - 8.8.8.8

# ======================= ADD YOUR NODES HERE =======================
# Option A: use a subscription (recommended). Replace the URL below.
# Option B: define proxies manually (examples commented out).
# Never commit real credentials or subscription URLs to a public repo.
# ======================================================================
proxy-providers:
  Subscription:
    type: http
    url: "https://your-subscription-url"   # <-- replace with your own
    interval: 3600
    path: ./proxies/subscription.yaml
    health-check:
      enable: true
      interval: 600
      url: http://cp.cloudflare.com/generate_204

# proxies:
  # --- Shadowsocks example ---
  # - {name: HK-SS, type: ss, server: YOUR_SERVER, port: 8388,
  #    cipher: aes-256-gcm, password: YOUR_PASSWORD, udp: true}

proxy-groups:
  - name: Proxy
    type: select
    include-all: true
    proxies: [DIRECT]
  - name: Auto
    type: url-test
    include-all: true
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 50
  - {name: Apple, type: select, proxies: [Proxy, Auto, DIRECT]}
  - {name: Telegram, type: select, proxies: [Proxy, Auto, DIRECT]}
  - {name: School, type: select, proxies: [Proxy, Auto, DIRECT]}
  - {name: BackCN, type: select, proxies: [Proxy, Auto, DIRECT]}
  - {name: ADblock, type: select, proxies: [REJECT, DIRECT]}

# Rule sets: lightweight, hand-maintained in us-kg/clash-rules-lite.
# Published to jsDelivr CDN on every push; refresh interval 24h.
rule-providers:
  lite-proxy:
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/us-kg/clash-rules-lite@release/proxy-rules.txt
    path: ./ruleset/lite-proxy.yaml
    interval: 86400
  lite-direct:
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/us-kg/clash-rules-lite@release/direct-rules.txt
    path: ./ruleset/lite-direct.yaml
    interval: 86400
  lite-edu:
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/us-kg/clash-rules-lite@release/edu-rules.txt
    path: ./ruleset/lite-edu.yaml
    interval: 86400
  lite-adslite:
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/us-kg/clash-rules-lite@release/adslite-rules.txt
    path: ./ruleset/lite-adslite.yaml
    interval: 86400
  lite-backcn:
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/us-kg/clash-rules-lite@release/backcn-rules.txt
    path: ./ruleset/lite-backcn.yaml
    interval: 86400

rules:
  # Local networks first — never proxied.
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  # Block ads.
  - RULE-SET,lite-adslite,ADblock
  # Service groups.
  - RULE-SET,lite-edu,School
  - RULE-SET,lite-backcn,BackCN
  - GEOSITE,apple,Apple
  - GEOSITE,telegram,Telegram
  # Proxy / direct splits.
  - RULE-SET,lite-proxy,Proxy
  - RULE-SET,lite-direct,DIRECT
  - MATCH,Proxy
